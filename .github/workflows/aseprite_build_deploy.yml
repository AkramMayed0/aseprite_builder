name: Build and deploy Aseprite

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  BUILD_TYPE: Release

jobs:
  build-aseprite:
    name: Build Aseprite (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite repository
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          submodules: recursive
          ref: v1.3.11
          path: aseprite

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Visual Studio developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and extract Skia (m102)
        shell: bash
        run: |
          mkdir -p skia
          curl -sL -o skia.zip https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip
          unzip -q skia.zip -d skia

      - name: Run CMake
        working-directory: aseprite
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DLAF_BACKEND=skia -DSKIA_DIR=../../skia -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 -DSKIA_LIBRARY=../../skia/out/Release-x64/skia.lib -G Ninja ..

      - name: Compile with Ninja
        working-directory: aseprite/build
        shell: cmd
        run: ninja aseprite

      - name: Package portable build
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          echo '# Portable config' > aseprite.ini
          7z a -tzip Aseprite-Windows-x64.zip aseprite.exe data/ aseprite.ini

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: aseprite/build/bin/Aseprite-Windows-x64.zip
